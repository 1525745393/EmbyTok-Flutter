# EmbyTok Flutter - 竖屏视频浏览客户端
name: embytok_flutter
description: "EmbyTok Flutter - 为 Emby 媒体服务器设计的竖屏视频浏览客户端"
publish_to: 'none'
version: 2.247.0+1311

environment:
  sdk: ">=3.0.0 <4.0.0"
  # 下限 3.44.0：代码使用 CardThemeData/DialogThemeData（3.44+）与
  # Color.withValues（3.27+），取最严格约束以保证本地与 CI 一致
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  go_router: ^13.0.0
  dio: ^5.4.3
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.0
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.4.1
  intl: ^0.20.2
  connectivity_plus: ^5.0.0
  video_player: ^2.9.0
  # 屏幕常亮：播放视频时防止息屏
  wakelock_plus: ^1.2.8
  # 内置 VLC 引擎（多播放器 PRD 第四阶段）：libvlc，网络流兼容性兜底
  vlc_player: ^2.1.2
  # MPV 引擎（多播放器 PRD 第三阶段）：基于 libmpv，支持 HDR/杜比/ASS 字幕/全格式
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  # Android native 库（libmpv.so），必须单独引入否则 MPV 无法运行
  media_kit_libs_android_video: ^1.3.8
  screen_brightness: ^0.2.2+1
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.0
  path_provider: ^2.1.0
  open_filex: ^4.6.0
  file_picker: ^8.0.0
  audio_session: ^0.1.21
  audio_service: ^0.18.15
  home_widget: ^0.9.4

  http: any
  share_plus: ^12.0.2
  crypto: ^3.0.7
  speech_to_text: ^7.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  http_mock_adapter: ^0.6.0
  mockito: ^5.4.0
  mocktail: ^1.0.0
  build_runner: ^2.4.0
  coverage: ^1.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
