# ===========================================================
# Android Release 自动化工作流（参考文章：Android项目的持续集成与自动化发布实践）
#
# 核心流程：push main → Semantic Release 分析提交 → 自动决定版本号 →
#          更新 pubspec.yaml → 生成 CHANGELOG → 构建签名 APK/AAB →
#          创建 Git Tag → 创建 GitHub Release → 上传构建产物
#
# 触发条件：
#   1. push 到 main 分支（标准发布流程）
#   2. workflow_dispatch（手动触发，用于应急）
#
# 依赖的 GitHub Secrets:
#   ANDROID_KEYSTORE     - keystore 文件的 base64 编码内容
#   ANDROID_KEYSTORE_PWD - keystore 密码
#   ANDROID_KEY_ALIAS    - key 别名（默认: embbytok）
#   ANDROID_KEY_PWD      - key 密码
# ===========================================================

name: Android Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/build-debug-apk.yml'
      - 'frontend/lib/test_mode/**'
      - 'frontend/test/test_mode/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================
  # Semantic Release + 构建 + 发布
  # ===========================================================
  release:
    name: 自动化发布
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: 检出代码（完整历史，供 Semantic Release 分析）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 设置 JDK 17（Gradle 构建需要）
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: 缓存 Gradle 依赖（节省 2-3 分钟构建时间）
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 缓存 Android NDK（避免每次重新下载安装）
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk
          key: ${{ runner.os }}-ndk-28.2.13676358
          restore-keys: |
            ${{ runner.os }}-ndk-

      - name: 安装 Android NDK 28.2.13676358（jni 插件要求）
        run: |
          echo "📥 检查/安装 NDK 28.2.13676358..."
          if [ -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then
            echo "✅ NDK 已缓存，跳过安装"
          else
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358"
            echo "✅ NDK 安装完成"
          fi

      - name: 设置 Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          # 与代码使用的 API 匹配（withValues 3.27+ / CardThemeData 3.44+）
          flutter-version: "3.44.8"
          cache: true

      - name: 设置 Node.js（运行 semantic-release）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 Flutter 依赖
        run: |
          echo "📦 安装 Flutter 项目依赖..."
          flutter pub get
          echo "✅ 依赖安装完成"
        working-directory: frontend

      - name: 安装 Semantic Release 及其插件（锁 major 版本）
        run: |
          echo "🔧 安装自动化发布工具 semantic-release（锁 major 版本）..."
          echo "ℹ️  这个工具会分析 git 提交信息，自动决定版本号"
          # 使用 ^major 版本范围，允许 minor/patch 更新但锁定 major，避免 breaking change
          npm install -g \
            semantic-release@^24 \
            @semantic-release/commit-analyzer@^13 \
            @semantic-release/release-notes-generator@^14 \
            @semantic-release/changelog@^6 \
            @semantic-release/exec@^6 \
            @semantic-release/git@^10 \
            @semantic-release/github@^11
          echo "✅ 发布工具安装完成"

      - name: 执行 Semantic Release（自动化发布流程）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PWD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PWD: ${{ secrets.ANDROID_KEY_PWD }}
        run: |
          echo "🚀 开始自动发布流程..."
          echo "📋 执行步骤：分析提交 → 决定版本号 → 更新版本 → 分析代码 → 构建 APK → 创建 Release"
          echo "🔑 使用 GitHub Secrets 中的签名密钥构建 APK"
          npx semantic-release
          echo "🎉 发布完成！请查看 Releases 页面下载 APK"

      - name: 上传 APK 到 Gofile（备用下载）
        if: success()
        continue-on-error: true
        run: |
          echo "☁️ 上传 APK 到 Gofile..."
          APK_FILE="frontend/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "⚠️ 未找到 arm64 APK，跳过"
            exit 0
          fi
          SIZE=$(du -m "$APK_FILE" | cut -f1)
          echo "📦 APK 大小: ${SIZE}MB"

          # 获取可用服务器
          SERVER=$(curl -s "https://api.gofile.io/servers" | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['servers'][0]['name'])")
          echo "🖥️ 使用服务器: $SERVER"

          # 上传
          RESULT=$(curl -s -F "file=@${APK_FILE}" "https://${SERVER}.gofile.io/contents/uploadfile")
          DOWNLOAD_URL=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['downloadPage'])")
          echo "🔗 Gofile 下载链接: $DOWNLOAD_URL"

          # 写入 Dart 常量文件
          python3 -c "import sys; url=sys.argv[1]; open('frontend/lib/utils/lanzou_url.dart','w').write('// 本文件由 Android Release 工作流自动生成，请勿手动编辑\n// 每次发版上传备用下载链接后更新\n\nconst String kLanzouShareUrl = \'' + url + '\';\n')" "$DOWNLOAD_URL"
          echo "📝 已写入 lanzou_url.dart"

      - name: 提交备用下载链接回仓库
        if: success()
        continue-on-error: true
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add frontend/lib/utils/lanzou_url.dart
          git diff --cached --quiet && echo "无变更" && exit 0
          git commit -m "chore(release): 更新备用下载链接 [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

      - name: 失败时上传诊断日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-logs
          path: |
            /tmp/analyze.log
            /tmp/flutter-build-debug.log
          retention-days: 7
          if-no-files-found: ignore
